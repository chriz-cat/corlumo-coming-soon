<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="description" content="Corlumo is coming soon. Business, connected." />
    <link rel="icon" type="image/svg+xml" href="assets/corlumo-logo-6.svg" />
    <title>Corlumo - Coming Soon</title>
    <style>
      :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #f7f6f2; }
      body { min-height: 100vh; margin: 0; color: #272424; }
      .page { width: min(100% - 5rem, 1320px); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
      header { min-height: 9rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; border-bottom: 1px solid #d9d7d0; }
      .brand { display: block; width: clamp(12rem, 19vw, 17rem); height: 5.8rem; object-fit: cover; object-position: center; }
      .header-note, .eyebrow, .footer-note { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .header-note { color: #686661; white-space: nowrap; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(5rem, 11vh, 9rem) 0; }
      .eyebrow { display: flex; align-items: center; gap: .9rem; margin: 0 0 2.2rem; color: #55524e; }
      .eyebrow::before { content: ""; width: .58rem; height: .58rem; border-radius: 50%; background: #304bf4; }
      h1 { max-width: 11ch; margin: 0; font-size: clamp(4.5rem, 10.5vw, 10.5rem); font-weight: 750; line-height: .9; letter-spacing: -.085em; }
      h1 span { color: #304bf4; }
      .intro-row { display: flex; align-items: end; justify-content: space-between; gap: 3rem; margin-top: clamp(4rem, 9vh, 7rem); padding-top: 1.7rem; border-top: 1px solid #aaa7a0; }
      .intro { max-width: 28rem; margin: 0; color: #4e4b47; font-size: clamp(1.05rem, 1.6vw, 1.4rem); line-height: 1.45; letter-spacing: -.025em; }
      .status { display: flex; align-items: center; gap: .75rem; margin: 0; color: #304bf4; font-size: .82rem; font-weight: 700; white-space: nowrap; }
      .status::before { content: ""; width: 2.4rem; height: 1px; background: currentColor; }
      footer { display: flex; justify-content: space-between; gap: 1.5rem; padding: 1.5rem 0 2rem; border-top: 1px solid #d9d7d0; color: #77736e; font-size: .75rem; }
      @media (max-width: 700px) {
        .page { width: min(100% - 2.5rem, 38rem); }
        header { min-height: 7rem; }
        .brand { width: 12rem; height: 4.5rem; }
        .header-note { display: none; }
        main { padding: 5rem 0 6rem; }
        h1 { font-size: clamp(3.9rem, 15vw, 7rem); }
        .intro-row { display: block; margin-top: 4.5rem; }
        .status { margin-top: 2rem; }
      }
      @media (max-width: 380px) { h1 { font-size: 3.65rem; } footer { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header aria-label="Corlumo">
        <img class="brand" src="assets/corlumo-logo-6.svg" width="1226" height="707" alt="Corlumo" />
        <span class="header-note">Business, connected.</span>
      </header>
      <main>
        <p class="eyebrow">Coming soon</p>
        <h1>Business,<br /><span>connected.</span></h1>
        <div class="intro-row">
          <p class="intro">A connected home for your business is taking shape. We look forward to showing you more.</p>
          <p class="status">Corlumo is on its way</p>
        </div>
      </main>
      <footer><span>© 2026 Corlumo</span><span class="footer-note">corlumo.co.za</span></footer>
    </div>
  </body>
</html>
